version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=llama3.2
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      - ollama
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads

volumes:
  ollama_data:
